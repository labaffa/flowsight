<main class="fsv2-main">
    <section class="fsv2-grid">
        <article class="fsv2-card fsv2-trend-card fsv2-card-full">
            <div class="fsv2-card-head">
                <div>
                    <h2>Search interest</h2>
                    <p>Google searches for displacement, refugees, and migration - Source: Google Trends - scale 0–100</p>
                </div>
                <button type="button" class="fsv2-info-btn"><i class="ti ti-info-circle" aria-hidden="true"></i></button>
            </div>
            <div class="fsv2-chart-surface fsv2-trend-surface" id="fsv2-search-ssi-chart"></div>
            <div class="fsv2-mini-legend">
                <span><span class="fsv2-dot fsv2-dot-tg"></span>Displacement</span>
                <span><span class="fsv2-dot fsv2-dot-alert"></span>Migration</span>
                <span><span class="fsv2-dot fsv2-dot-violet"></span>Refugees</span>
            </div>
        </article>
    </section>
</main>
