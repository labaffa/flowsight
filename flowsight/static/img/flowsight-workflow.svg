      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#201E1A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11V1Z" fill="#7A7A70"/>
    </marker>
  </defs>

  <rect width="1600" height="980" rx="28" fill="url(#page)"/>

  <g filter="url(#shadow)">
    <rect x="90" y="88" width="430" height="230" rx="24" fill="#FFFFFF"/>
