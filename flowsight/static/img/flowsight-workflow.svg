  <text x="287" y="464" fill="#A46A0D" font-family="Open Sans, Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="0.08em">
    PROCESSING LAYER
  </text>
  <text x="287" y="516" fill="#1A1917" font-family="Open Sans, Segoe UI, sans-serif" font-size="33" font-weight="700">
    Cleansing, topic modeling, sentiment analysis, TF-IDF
  </text>
  <text x="287" y="560" fill="#4B4A44" font-family="Open Sans, Segoe UI, sans-serif" font-size="18">
    <tspan x="287" dy="0">The three streams are filtered, normalized, classified, and aggregated into interpretable mobility signals.</tspan>
  </text>

