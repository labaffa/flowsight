  </g>
  <text x="1116" y="142" fill="#7F77DD" font-family="Open Sans, Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="0.08em">
    SEARCH INTEREST
  </text>
  <text x="1116" y="188" fill="#1A1917" font-family="Open Sans, Segoe UI, sans-serif" font-size="30" font-weight="700">
    Google Trends
  </text>
  <text x="1116" y="226" fill="#4B4A44" font-family="Open Sans, Segoe UI, sans-serif" font-size="18">
    <tspan x="1116" dy="0">Search behavior reveals changes in</tspan>
    <tspan x="1116" dy="29">public concern, attention, and awareness</tspan>
    <tspan x="1116" dy="29">related to mobility crises.</tspan>
  </text>

  <path d="M305 318V382" stroke="#7A7A70" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M800 318V382" stroke="#7A7A70" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1295 318V382" stroke="#7A7A70" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

