  </g>
  <text x="126" y="142" fill="#1D9E75" font-family="Open Sans, Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="0.08em">
    SOCIAL LISTENING
  </text>
  <text x="126" y="188" fill="#1A1917" font-family="Open Sans, Segoe UI, sans-serif" font-size="30" font-weight="700">
    Telegram
  </text>
  <text x="126" y="226" fill="#4B4A44" font-family="Open Sans, Segoe UI, sans-serif" font-size="18">
    <tspan x="126" dy="0">Public groups and channels capture</tspan>
    <tspan x="126" dy="29">high-frequency discourse, narratives,</tspan>
    <tspan x="126" dy="29">coordination, and sentiment trends.</tspan>
  </text>

  <g filter="url(#shadow)">
    <rect x="585" y="88" width="430" height="230" rx="24" fill="#FFFFFF"/>
    <rect x="585" y="88" width="430" height="12" rx="6" fill="#378ADD"/>
  </g>
  <text x="621" y="142" fill="#378ADD" font-family="Open Sans, Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="0.08em">
    MEDIA MONITORING
  </text>
  <text x="621" y="188" fill="#1A1917" font-family="Open Sans, Segoe UI, sans-serif" font-size="30" font-weight="700">
    Online news
  </text>
  <text x="621" y="226" fill="#4B4A44" font-family="Open Sans, Segoe UI, sans-serif" font-size="18">
    <tspan x="621" dy="0">Local reporting adds context, event</tspan>
    <tspan x="621" dy="29">framing, and geographic detail around</tspan>
    <tspan x="621" dy="29">displacement and mobility developments.</tspan>
  </text>

  <g filter="url(#shadow)">
    <rect x="1080" y="88" width="430" height="230" rx="24" fill="#FFFFFF"/>
